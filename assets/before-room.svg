<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f0d"/>
      <stop offset="1" stop-color="#131c18"/>
    </linearGradient>
    <radialGradient id="light" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#c5a059" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#4f7942" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#light)"/>

  <!-- room frame -->
  <rect x="120" y="120" width="960" height="560" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M160 550 L520 300 L640 380 L940 250" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="12" stroke-linecap="round"/>
  <path d="M160 550 L520 300 L640 380 L940 250" fill="none" stroke="#C5A059" stroke-opacity="0.40" stroke-width="3" stroke-linecap="round"/>

  <!-- wall unevenness marks -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="2">
    <path d="M250 200 C240 240, 280 270, 260 310 C245 345, 290 380, 270 420" fill="none"/>
    <path d="M940 210 C960 250, 920 290, 950 340 C970 380, 920 420, 945 470" fill="none"/>
  </g>

  <!-- caption -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Arial" fill="#ffffff" fill-opacity="0.82">
    <text x="160" y="720" font-size="26" font-weight="800">Фото до ремонта (демо)</text>
    <text x="160" y="754" font-size="18" opacity="0.75">перепады стен • нужна замена инженерки • подготовка под перепланировку</text>
  </g>
</svg>

